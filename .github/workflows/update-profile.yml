name: Update profile card

on:
  schedule:
    - cron: "17 4 * * *"  # once a day
  workflow_dispatch: {}
  push:
    paths:
      - card_template.txt
      - generate_readme_svg.py

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate SVGs
        env:
          # PROFILE_TOKEN must be a PAT with `repo` scope, saved as a repo
          # secret, so private repos/commits are counted. Falls back to the
          # default GITHUB_TOKEN (public data only) if that secret isn't set.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 generate_readme_svg.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "Update profile stats"
          git push
